<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>3반 알리미</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#14161a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="3반 알리미">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="description" content="3반 수행평가·행사·생기부 안내">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style>
:root{
  --ink:#14161a;
  --paper:#ffffff;
  --rule:#e6e8ec;
  --dim:#8d939c;
  --dimmer:#b8bcc4;
  --hl-perf:#ffe95c;   /* 수행평가 */
  --hl-event:#c9b8ff;  /* 행사 */
  --hl-record:#a3efc9; /* 생기부 */
  --urgent:#e5352b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-feature-settings:'tnum';
  padding-bottom:calc(env(safe-area-inset-bottom) + 96px);
}
button,input,textarea,select{font-family:inherit;color:inherit}

/* ── 헤더 ── */
header{
  position:sticky;top:0;z-index:20;
  background:var(--paper);
  padding:calc(env(safe-area-inset-top) + 20px) 20px 0;
  border-bottom:1px solid var(--rule);
}
.brand{display:flex;align-items:baseline;gap:9px;cursor:pointer;user-select:none}
.brand h1{
  font-size:27px;font-weight:900;letter-spacing:-.045em;margin:0;
}
.brand .today{font-size:13px;font-weight:600;color:var(--dim);letter-spacing:-.02em}
.tabs{display:flex;gap:22px;margin-top:16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  background:none;border:0;padding:0 0 11px;margin:0;
  font-size:15px;font-weight:700;letter-spacing:-.03em;color:var(--dimmer);
  white-space:nowrap;cursor:pointer;border-bottom:2.5px solid transparent;
}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab .n{font-size:11px;font-weight:700;vertical-align:super;margin-left:3px}

/* ── 목록 ── */
main{padding:0 20px}
.row{
  display:grid;grid-template-columns:58px 1fr;gap:15px;
  padding:19px 0;border-bottom:1px solid var(--rule);
  cursor:pointer;align-items:start;
}
.row:active{opacity:.55}
.dcell{text-align:right;padding-top:1px}
.dnum{font-size:25px;font-weight:900;letter-spacing:-.06em;line-height:.95;display:block}
.dlabel{font-size:10.5px;font-weight:700;color:var(--dim);letter-spacing:-.01em;display:block;margin-top:4px}
.dnum.urgent{color:var(--urgent)}
.dnum.none{font-size:15px;font-weight:800;color:var(--dimmer);letter-spacing:-.03em}
.rtitle{
  font-size:16.5px;font-weight:800;letter-spacing:-.035em;line-height:1.35;
  margin:0 0 6px;word-break:keep-all;
}
.rtitle mark{background:linear-gradient(transparent 58%,var(--mk) 58%);color:inherit;padding:0 1px}
.rmeta{font-size:12.5px;font-weight:600;color:var(--dim);letter-spacing:-.02em;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.rmeta .cat{color:var(--ink);font-weight:800}
.rprev{font-size:13.5px;color:var(--dim);line-height:1.5;margin:7px 0 0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;letter-spacing:-.02em}
.thumbs{display:flex;gap:5px;margin-top:9px}
.thumbs img{width:48px;height:48px;object-fit:cover;border-radius:5px;border:1px solid var(--rule)}
.row.past{opacity:.42}
.row.past .dnum{font-size:17px;color:var(--dim)}

.sechead{
  font-size:11px;font-weight:800;letter-spacing:.09em;color:var(--dimmer);
  padding:26px 0 9px;border-bottom:1px solid var(--rule);
}
.empty{padding:70px 0;text-align:center;color:var(--dimmer);font-size:14px;font-weight:600;letter-spacing:-.02em}
.empty b{display:block;color:var(--dim);font-size:16px;font-weight:800;margin-bottom:7px}

/* ── 상세 시트 ── */
.sheet{
  position:fixed;inset:0;z-index:60;background:var(--paper);
  overflow-y:auto;display:none;
  padding:calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 48px);
}
.sheet.on{display:block;animation:up .22s ease}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.sheettop{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}
.xbtn{background:none;border:0;font-size:15px;font-weight:700;color:var(--dim);padding:6px 0;cursor:pointer;letter-spacing:-.02em}
.dtl-cat{font-size:11.5px;font-weight:800;letter-spacing:.05em;margin-bottom:11px}
.dtl-title{font-size:25px;font-weight:900;letter-spacing:-.05em;line-height:1.28;margin:0 0 13px;word-break:keep-all}
.dtl-date{font-size:14px;font-weight:700;color:var(--dim);letter-spacing:-.02em;padding-bottom:20px;border-bottom:2px solid var(--ink)}
.dtl-body{font-size:15.5px;line-height:1.72;white-space:pre-wrap;margin:22px 0 0;letter-spacing:-.02em;word-break:keep-all}
.dtl-imgs{margin-top:24px;display:flex;flex-direction:column;gap:11px}
.dtl-imgs img{width:100%;border-radius:9px;border:1px solid var(--rule);display:block}
.imgcap{font-size:11.5px;color:var(--dimmer);font-weight:600;text-align:center;margin-top:-4px}
.dtl-foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--rule);font-size:12px;color:var(--dimmer);font-weight:600;display:flex;justify-content:space-between}
.delbtn{background:none;border:0;color:var(--urgent);font-weight:700;font-size:12px;cursor:pointer;padding:0}

/* ── 작성 폼 ── */
label.f{display:block;font-size:12px;font-weight:800;letter-spacing:-.01em;margin:19px 0 7px;color:var(--dim)}
input[type=text],input[type=date],input[type=password],textarea,select{
  width:100%;padding:13px 14px;border:1.5px solid var(--rule);border-radius:10px;
  font-size:15.5px;font-weight:600;letter-spacing:-.02em;background:var(--paper);outline:none;
}
input:focus,textarea:focus,select:focus{border-color:var(--ink)}
textarea{min-height:140px;resize:vertical;line-height:1.6;font-weight:500}
.catpick{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.catpick button{
  padding:13px 4px;border:1.5px solid var(--rule);background:var(--paper);border-radius:10px;
  font-size:13px;font-weight:800;letter-spacing:-.03em;cursor:pointer;
}
.catpick button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.primary{
  width:100%;padding:16px;border:0;border-radius:12px;background:var(--ink);color:#fff;
  font-size:16px;font-weight:800;letter-spacing:-.03em;cursor:pointer;margin-top:28px;
}
.primary:disabled{background:var(--rule);color:var(--dimmer)}
.picked{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.picked .p{position:relative}
.picked img{width:70px;height:70px;object-fit:cover;border-radius:7px;border:1px solid var(--rule);display:block}
.picked .rm{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;
  background:var(--ink);color:#fff;border:0;font-size:13px;line-height:1;cursor:pointer}
.hint{font-size:11.5px;color:var(--dimmer);font-weight:600;margin-top:7px;letter-spacing:-.01em;line-height:1.5}
.filebtn{
  width:100%;padding:15px;border:1.5px dashed var(--rule);border-radius:10px;background:var(--paper);
  font-size:14px;font-weight:700;color:var(--dim);cursor:pointer;letter-spacing:-.02em;
}

/* ── FAB / 상태 ── */
.fab{
  position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom) + 22px);z-index:30;
  width:56px;height:56px;border-radius:50%;border:0;background:var(--ink);color:#fff;
  font-size:27px;font-weight:300;line-height:1;cursor:pointer;display:none;
  box-shadow:0 6px 20px rgba(0,0,0,.22);
}
.fab.on{display:block}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 92px);
  background:var(--ink);color:#fff;padding:12px 19px;border-radius:999px;font-size:13.5px;font-weight:700;
  z-index:90;opacity:0;transition:opacity .2s;pointer-events:none;letter-spacing:-.02em;max-width:88vw;text-align:center;
}
.toast.on{opacity:1}
.install{
  margin:16px 0 0;padding:14px 16px;border:1.5px solid var(--ink);border-radius:12px;
  display:none;align-items:center;justify-content:space-between;gap:12px;
}
.install.on{display:flex}
.install span{font-size:13.5px;font-weight:700;letter-spacing:-.03em;line-height:1.4}
.install button{background:var(--ink);color:#fff;border:0;padding:9px 15px;border-radius:8px;font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap}
.install .close{background:none;color:var(--dimmer);padding:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="brand" id="brand">
    <h1>3반 알리미</h1>
    <span class="today" id="today"></span>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-cat="all" aria-selected="true">전체<span class="n" data-n="all"></span></button>
    <button class="tab" role="tab" data-cat="수행평가" aria-selected="false">수행평가<span class="n" data-n="수행평가"></span></button>
    <button class="tab" role="tab" data-cat="행사" aria-selected="false">행사<span class="n" data-n="행사"></span></button>
    <button class="tab" role="tab" data-cat="생기부" aria-selected="false">생기부<span class="n" data-n="생기부"></span></button>
  </div>
</header>

<main>
  <div class="install" id="install">
    <span>홈 화면에 추가하면 앱처럼 바로 열려요</span>
    <button id="installGo">설치</button>
    <button class="close" id="installNo">✕</button>
  </div>
  <div id="list"><div class="empty">불러오는 중…</div></div>
</main>

<button class="fab" id="fab" aria-label="새 안내 작성">+</button>

<!-- 상세 -->
<section class="sheet" id="detail">
  <div class="sheettop">
    <button class="xbtn" onclick="closeSheet('detail')">← 목록</button>
    <button class="delbtn" id="delBtn" style="display:none" onclick="removeItem()">삭제</button>
  </div>
  <div id="detailBody"></div>
</section>

<!-- 작성 -->
<section class="sheet" id="write">
  <div class="sheettop">
    <button class="xbtn" onclick="closeSheet('write')">← 취소</button>
    <strong style="font-size:14px;font-weight:800;letter-spacing:-.03em">새 안내</strong>
  </div>

  <label class="f">분류</label>
  <div class="catpick" id="catpick">
    <button data-c="수행평가" aria-pressed="true">수행평가</button>
    <button data-c="행사" aria-pressed="false">행사</button>
    <button data-c="생기부" aria-pressed="false">생기부</button>
  </div>

  <label class="f" for="wTitle">제목</label>
  <input type="text" id="wTitle" placeholder="예) 국어 발표 수행평가">

  <label class="f" for="wDate">날짜 (마감일·행사일)</label>
  <input type="date" id="wDate">
  <p class="hint">비워두면 날짜 없는 안내로 올라가요.</p>

  <label class="f" for="wBody">내용</label>
  <textarea id="wBody" placeholder="준비물, 제출 방법, 유의사항 등"></textarea>

  <label class="f">사진 (최대 4장)</label>
  <button class="filebtn" id="pickBtn">사진 고르기</button>
  <input type="file" id="wFile" accept="image/*" multiple hidden>
  <div class="picked" id="picked"></div>
  <p class="hint">공지 원본 사진을 그대로 올려도 돼요. 자동으로 용량을 줄여서 저장합니다.</p>

  <button class="primary" id="saveBtn">올리기</button>
</section>

<!-- 관리자 로그인 -->
<section class="sheet" id="admin">
  <div class="sheettop">
    <button class="xbtn" onclick="closeSheet('admin')">← 닫기</button>
    <strong style="font-size:14px;font-weight:800;letter-spacing:-.03em">관리자</strong>
  </div>
  <div id="adminBox">
    <label class="f" for="aEmail">이메일</label>
    <input type="text" id="aEmail" autocomplete="username">
    <label class="f" for="aPw">비밀번호</label>
    <input type="password" id="aPw" autocomplete="current-password">
    <button class="primary" id="loginBtn">로그인</button>
  </div>
</section>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, collection, doc, addDoc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

/* ── Firebase 연결 정보 (class3 프로젝트) ── */
const firebaseConfig = {
  apiKey: "AIzaSyAtEAosGkDJwkLrI5Vurcw5UgTWpIzyAl0",
  authDomain: "class3-6cf01.firebaseapp.com",
  projectId: "class3-6cf01",
  storageBucket: "class3-6cf01.firebasestorage.app",
  messagingSenderId: "536241412318",
  appId: "1:536241412318:web:de6f6080a6a525f3124a4f"
};

const app  = initializeApp(firebaseConfig);
const db   = getFirestore(app);
const auth = getAuth(app);
const COL  = collection(db, 'notices');

const HL = { '수행평가':'var(--hl-perf)', '행사':'var(--hl-event)', '생기부':'var(--hl-record)' };

let items = [], cat = 'all', isAdmin = false, current = null, pics = [];

/* ── 날짜 계산 ── */
const midnight = (d) => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const TODAY = midnight(new Date());

function dday(dateStr){
  if(!dateStr) return null;
  const target = midnight(new Date(dateStr + 'T00:00:00'));
  return Math.round((target - TODAY) / 86400000);
}
function ddayText(n){
  if(n === null) return { num:'상시', label:'', cls:'none' };
  if(n === 0)  return { num:'오늘', label:'',      cls:'urgent' };
  if(n === 1)  return { num:'내일', label:'',      cls:'urgent' };
  if(n > 0)    return { num:'D-'+n, label:'',      cls: n <= 3 ? 'urgent' : '' };
  return { num:'D+'+Math.abs(n), label:'지남', cls:'' };
}
function korDate(s){
  if(!s) return '날짜 없음';
  const d = new Date(s + 'T00:00:00');
  const w = ['일','월','화','수','목','금','토'][d.getDay()];
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${w})`;
}

/* ── 렌더 ── */
function render(){
  const box = document.getElementById('list');
  const pool = items.filter(i => cat === 'all' || i.cat === cat);

  // 개수 배지
  document.querySelectorAll('[data-n]').forEach(el => {
    const c = el.dataset.n;
    const n = items.filter(i => (c === 'all' || i.cat === c) && (i.date === '' || dday(i.date) >= 0)).length;
    el.textContent = n || '';
  });

  const live = pool.filter(i => i.date === '' || dday(i.date) >= 0)
                   .sort((a,b) => (a.date || '9999').localeCompare(b.date || '9999'));
  const past = pool.filter(i => i.date !== '' && dday(i.date) < 0)
                   .sort((a,b) => b.date.localeCompare(a.date));

  if(!live.length && !past.length){
    box.innerHTML = '<div class="empty"><b>아직 올라온 안내가 없어요</b>새 안내가 등록되면 여기에 표시됩니다</div>';
    return;
  }

  let html = live.map(i => rowHTML(i,false)).join('');
  if(past.length){
    html += '<div class="sechead">지난 안내</div>' + past.map(i => rowHTML(i,true)).join('');
  }
  box.innerHTML = html;

  box.querySelectorAll('.row').forEach(r => r.onclick = () => openDetail(r.dataset.id));
}

function rowHTML(i, isPast){
  const d = ddayText(dday(i.date));
  const thumbs = (i.images||[]).slice(0,3)
    .map(src => `<img src="${src}" alt="">`).join('');
  return `
  <article class="row ${isPast?'past':''}" data-id="${i.id}">
    <div class="dcell">
      <span class="dnum ${d.cls}">${d.num}</span>
      ${d.label ? `<span class="dlabel">${d.label}</span>` : ''}
    </div>
    <div>
      <h2 class="rtitle"><mark style="--mk:${HL[i.cat]}">${esc(i.title)}</mark></h2>
      <div class="rmeta"><span class="cat">${i.cat}</span><span>·</span><span>${korDate(i.date)}</span></div>
      ${i.body ? `<p class="rprev">${esc(i.body)}</p>` : ''}
      ${thumbs ? `<div class="thumbs">${thumbs}</div>` : ''}
    </div>
  </article>`;
}

const esc = (s='') => s.replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

/* ── 상세 ── */
window.openDetail = (id) => {
  const i = items.find(x => x.id === id); if(!i) return;
  current = i;
  const imgs = (i.images||[]).map((src,n) =>
    `<img src="${src}" alt="안내 사진 ${n+1}" onclick="window.open(this.src,'_blank')">`).join('');
  document.getElementById('detailBody').innerHTML = `
    <div class="dtl-cat" style="background:linear-gradient(transparent 55%, ${HL[i.cat]} 55%);display:inline-block">${i.cat}</div>
    <h2 class="dtl-title">${esc(i.title)}</h2>
    <div class="dtl-date">${korDate(i.date)}${i.date ? ' · ' + ddayText(dday(i.date)).num : ''}</div>
    ${i.body ? `<p class="dtl-body">${esc(i.body)}</p>` : ''}
    ${imgs ? `<div class="dtl-imgs">${imgs}<p class="imgcap">사진을 누르면 원본 크기로 열려요</p></div>` : ''}
    <div class="dtl-foot"><span>3반 알리미</span><span>${i.createdAt ? new Date(i.createdAt).toLocaleDateString('ko-KR') + ' 등록' : ''}</span></div>`;
  document.getElementById('delBtn').style.display = isAdmin ? 'block' : 'none';
  openSheet('detail');
};

window.removeItem = async () => {
  if(!current || !confirm('이 안내를 삭제할까요?')) return;
  await deleteDoc(doc(db, 'notices', current.id));
  closeSheet('detail'); toast('삭제했어요');
};

window.openSheet  = (id) => { document.getElementById(id).classList.add('on'); document.body.style.overflow='hidden'; };
window.closeSheet = (id) => { document.getElementById(id).classList.remove('on'); document.body.style.overflow=''; };

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 2200);
}

/* ── 탭 ── */
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected','false'));
  t.setAttribute('aria-selected','true');
  cat = t.dataset.cat; render();
});

/* ── 실시간 구독 ── */
onSnapshot(query(COL, orderBy('createdAt','desc')), (snap) => {
  items = snap.docs.map(d => {
    const v = d.data();
    return { id:d.id, cat:v.cat||'행사', title:v.title||'', date:v.date||'', body:v.body||'',
             images:v.images||[], createdAt: v.createdAt?.toMillis?.() || null };
  });
  render();
}, () => {
  document.getElementById('list').innerHTML =
    '<div class="empty"><b>연결에 실패했어요</b>Firebase 설정을 확인해 주세요</div>';
});

/* ── 관리자 ── */
let taps = 0, tapTimer;
document.getElementById('brand').onclick = () => {
  taps++; clearTimeout(tapTimer);
  tapTimer = setTimeout(() => taps = 0, 1200);
  if(taps >= 5){
    taps = 0;
    if(isAdmin){ if(confirm('로그아웃할까요?')) signOut(auth); }
    else openSheet('admin');
  }
};

onAuthStateChanged(auth, (user) => {
  isAdmin = !!user;
  document.getElementById('fab').classList.toggle('on', isAdmin);
  if(user) closeSheet('admin');
});

document.getElementById('loginBtn').onclick = async () => {
  try{
    await signInWithEmailAndPassword(auth,
      document.getElementById('aEmail').value.trim(),
      document.getElementById('aPw').value);
    document.getElementById('aPw').value = '';
    toast('관리자 모드');
  }catch{ toast('이메일이나 비밀번호를 확인해 주세요'); }
};

/* ── 작성 ── */
let wCat = '수행평가';
document.querySelectorAll('#catpick button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#catpick button').forEach(x => x.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true'); wCat = b.dataset.c;
});

document.getElementById('fab').onclick = () => {
  wCat = '수행평가';
  document.querySelectorAll('#catpick button').forEach((x,n) => x.setAttribute('aria-pressed', n===0?'true':'false'));
  ['wTitle','wDate','wBody'].forEach(id => document.getElementById(id).value = '');
  pics = []; drawPicked(); openSheet('write');
};

document.getElementById('pickBtn').onclick = () => document.getElementById('wFile').click();

document.getElementById('wFile').onchange = async (e) => {
  const files = [...e.target.files].slice(0, 4 - pics.length);
  for(const f of files){
    try{ pics.push(await compress(f)); }
    catch{ toast('사진 하나를 못 읽었어요'); }
  }
  drawPicked(); e.target.value = '';
};

function drawPicked(){
  document.getElementById('picked').innerHTML = pics.map((src,n) =>
    `<div class="p"><img src="${src}" alt=""><button class="rm" onclick="dropPic(${n})">✕</button></div>`).join('');
}
window.dropPic = (n) => { pics.splice(n,1); drawPicked(); };

// 사진을 긴 변 1400px, 용량 220KB 정도로 줄여서 base64로 변환
function compress(file){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const max = 1400;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      let q = 0.75, out = c.toDataURL('image/jpeg', q);
      while(out.length > 300000 && q > 0.35){ q -= 0.1; out = c.toDataURL('image/jpeg', q); }
      URL.revokeObjectURL(img.src);
      res(out);
    };
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}

document.getElementById('saveBtn').onclick = async () => {
  const title = document.getElementById('wTitle').value.trim();
  if(!title){ toast('제목을 입력해 주세요'); return; }

  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = '올리는 중…';
  try{
    await addDoc(COL, {
      cat: wCat, title,
      date: document.getElementById('wDate').value,
      body: document.getElementById('wBody').value.trim(),
      images: pics,
      createdAt: serverTimestamp()
    });
    closeSheet('write'); toast('올렸어요');
  }catch{
    toast('저장에 실패했어요. 사진 수를 줄여보세요');
  }
  btn.disabled = false; btn.textContent = '올리기';
};

/* ── 오늘 날짜 · 설치 · 서비스워커 ── */
document.getElementById('today').textContent =
  `${TODAY.getMonth()+1}월 ${TODAY.getDate()}일 ${['일','월','화','수','목','금','토'][TODAY.getDay()]}요일`;

let deferred = null;
const bar = document.getElementById('install');
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault(); deferred = e;
  if(!standalone) bar.classList.add('on');
});
if(!standalone && /iphone|ipad|ipod/i.test(navigator.userAgent)){
  bar.querySelector('span').textContent = '공유 버튼 → 홈 화면에 추가 를 누르면 앱처럼 열려요';
  document.getElementById('installGo').style.display = 'none';
  bar.classList.add('on');
}
document.getElementById('installGo').onclick = async () => {
  if(!deferred) return;
  deferred.prompt(); await deferred.userChoice; deferred = null; bar.classList.remove('on');
};
document.getElementById('installNo').onclick = () => bar.classList.remove('on');

if('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));

addEventListener('keydown', e => {
  if(e.key === 'Escape') document.querySelectorAll('.sheet.on').forEach(s => closeSheet(s.id));
});
</script>
