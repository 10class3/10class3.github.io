<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>3반 알리미</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" id="themeMeta" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="3반 알리미">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="description" content="3반 수행평가·행사·생기부 안내">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style>
:root{
  --ink:#14161a;
  --paper:#ffffff;
  --panel:#ffffff;
  --rule:#e6e8ec;
  --dim:#8d939c;
  --dimmer:#b8bcc4;
  --urgent:#e5352b;
  --markpos:58%;          /* 밝은 화면: 형광펜 */
  --lb:#000;
}
html[data-theme="dark"]{
  --ink:#eef1f6;
  --paper:#101216;
  --panel:#171a20;
  --rule:#2a2f38;
  --dim:#878e9b;
  --dimmer:#5c636f;
  --urgent:#ff6b62;
  --markpos:88%;          /* 어두운 화면: 얇은 밑줄 */
  --lb:#000;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--paper)}
body{
  color:var(--ink);
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-feature-settings:'tnum';
  padding-bottom:calc(env(safe-area-inset-bottom) + 96px);
  transition:background .18s,color .18s;
}
button,input,textarea{font-family:inherit;color:inherit}

header{
  position:sticky;top:0;z-index:20;background:var(--paper);
  padding:calc(env(safe-area-inset-top) + 18px) 20px 0;border-bottom:1px solid var(--rule);
}
.hrow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.brand{cursor:pointer;user-select:none;flex:1;min-width:0}
.brand h1{font-size:26px;font-weight:900;letter-spacing:-.045em;margin:0}
.brand .today{font-size:12.5px;font-weight:600;color:var(--dim);letter-spacing:-.02em;display:block;margin-top:3px}
.hact{display:flex;gap:6px;flex-shrink:0;padding-top:3px;align-items:center}
.hbtn{
  border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:999px;
  padding:8px 13px;font-size:12.5px;font-weight:800;letter-spacing:-.03em;cursor:pointer;white-space:nowrap;
}
.hbtn.ghost{background:transparent;color:var(--ink)}
.iconbtn{
  width:34px;height:34px;border-radius:999px;border:1.5px solid var(--rule);background:transparent;
  font-size:15px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;
}
[hidden]{display:none!important}

.tabs{display:flex;gap:19px;margin-top:15px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  background:none;border:0;padding:0 0 11px;margin:0;
  font-size:15px;font-weight:700;letter-spacing:-.03em;color:var(--dimmer);
  white-space:nowrap;cursor:pointer;border-bottom:2.5px solid transparent;
}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab .n{font-size:11px;font-weight:700;vertical-align:super;margin-left:3px}

main{padding:0 20px}
.row{display:grid;grid-template-columns:58px 1fr;gap:15px;padding:19px 0;
  border-bottom:1px solid var(--rule);cursor:pointer;align-items:start}
.row:active{opacity:.55}
.dcell{text-align:right;padding-top:1px}
.dnum{font-size:25px;font-weight:900;letter-spacing:-.06em;line-height:.95;display:block}
.dlabel{font-size:10.5px;font-weight:700;color:var(--dim);display:block;margin-top:4px}
.dnum.urgent{color:var(--urgent)}
.dnum.none{font-size:15px;font-weight:800;color:var(--dimmer);letter-spacing:-.03em}
.rtitle{font-size:16.5px;font-weight:800;letter-spacing:-.035em;line-height:1.35;margin:0 0 6px;word-break:keep-all}
.rtitle mark{background:linear-gradient(transparent var(--markpos),var(--mk) var(--markpos));color:inherit;padding:0 1px}
.rmeta{font-size:12.5px;font-weight:600;color:var(--dim);letter-spacing:-.02em;display:flex;gap:7px;flex-wrap:wrap}
.rmeta .cat{color:var(--ink);font-weight:800}
.rprev{font-size:13.5px;color:var(--dim);line-height:1.5;margin:7px 0 0;letter-spacing:-.02em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.thumbs{display:flex;gap:5px;margin-top:9px}
.thumbs img{width:48px;height:48px;object-fit:cover;border-radius:5px;border:1px solid var(--rule)}
.row.past{opacity:.42}
.row.past .dnum{font-size:17px;color:var(--dim)}

.sechead{font-size:11px;font-weight:800;letter-spacing:.09em;color:var(--dimmer);
  padding:26px 0 9px;border-bottom:1px solid var(--rule)}
.empty{padding:70px 0;text-align:center;color:var(--dimmer);font-size:14px;font-weight:600;letter-spacing:-.02em}
.empty b{display:block;color:var(--dim);font-size:16px;font-weight:800;margin-bottom:7px}

.sheet{position:fixed;inset:0;z-index:60;background:var(--paper);overflow-y:auto;display:none;
  padding:calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 48px)}
.sheet.on{display:block;animation:up .22s ease}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.sheettop{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}
.xbtn{background:none;border:0;font-size:15px;font-weight:700;color:var(--dim);padding:6px 0;cursor:pointer;letter-spacing:-.02em}
.dtl-cat{font-size:11.5px;font-weight:800;letter-spacing:.05em;margin-bottom:11px;padding:0 2px}
.dtl-title{font-size:25px;font-weight:900;letter-spacing:-.05em;line-height:1.28;margin:0 0 13px;word-break:keep-all}
.dtl-date{font-size:14px;font-weight:700;color:var(--dim);letter-spacing:-.02em;padding-bottom:20px;border-bottom:2px solid var(--ink)}
.dtl-body{font-size:15.5px;line-height:1.72;white-space:pre-wrap;margin:22px 0 0;letter-spacing:-.02em;word-break:keep-all}
.dtl-imgs{margin-top:24px;display:flex;flex-direction:column;gap:11px}
.dtl-imgs img{width:100%;border-radius:9px;border:1px solid var(--rule);display:block;cursor:zoom-in}
.imgcap{font-size:11.5px;color:var(--dimmer);font-weight:600;text-align:center;margin-top:-4px}
.dtl-foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--rule);
  font-size:12px;color:var(--dimmer);font-weight:600;display:flex;justify-content:space-between}
.delbtn{background:none;border:0;color:var(--urgent);font-weight:700;font-size:12px;cursor:pointer;padding:0}

label.f{display:block;font-size:12px;font-weight:800;margin:19px 0 7px;color:var(--dim)}
input[type=text],input[type=date],input[type=password],textarea{
  width:100%;padding:13px 14px;border:1.5px solid var(--rule);border-radius:10px;
  font-size:15.5px;font-weight:600;letter-spacing:-.02em;background:var(--panel);outline:none}
input:focus,textarea:focus{border-color:var(--ink)}
textarea{min-height:140px;resize:vertical;line-height:1.6;font-weight:500}
input[type=date]{color-scheme:light dark}
.catpick{display:flex;flex-wrap:wrap;gap:7px}
.catpick button{flex:1 1 30%;min-width:88px;padding:13px 6px;border:1.5px solid var(--rule);
  background:transparent;border-radius:10px;font-size:13px;font-weight:800;letter-spacing:-.03em;
  cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catpick button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.primary{width:100%;padding:16px;border:0;border-radius:12px;background:var(--ink);color:var(--paper);
  font-size:16px;font-weight:800;letter-spacing:-.03em;cursor:pointer;margin-top:28px}
.primary:disabled{opacity:.45}
.picked{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.picked .p{position:relative}
.picked img{width:70px;height:70px;object-fit:cover;border-radius:7px;border:1px solid var(--rule);display:block}
.picked .rm{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;
  background:var(--ink);color:var(--paper);border:0;font-size:13px;line-height:1;cursor:pointer}
.hint{font-size:11.5px;color:var(--dimmer);font-weight:600;margin-top:7px;line-height:1.5}
.filebtn{width:100%;padding:15px;border:1.5px dashed var(--rule);border-radius:10px;background:transparent;
  font-size:14px;font-weight:700;color:var(--dim);cursor:pointer;letter-spacing:-.02em}

/* 분류 편집 */
.crow{display:flex;align-items:center;gap:9px;padding:11px 0;border-bottom:1px solid var(--rule)}
.crow .sw{width:15px;height:15px;border-radius:4px;flex-shrink:0}
.crow input{flex:1;padding:11px 12px;font-size:15px}
.crow .del{background:none;border:0;color:var(--dim);font-size:19px;cursor:pointer;padding:4px 2px;flex-shrink:0}

.fab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom) + 22px);z-index:30;
  width:56px;height:56px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);
  font-size:27px;font-weight:300;line-height:1;cursor:pointer;display:none;box-shadow:0 6px 20px rgba(0,0,0,.28)}
.fab.on{display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 92px);
  background:var(--ink);color:var(--paper);padding:12px 19px;border-radius:999px;font-size:13.5px;font-weight:700;
  z-index:130;opacity:0;transition:opacity .2s;pointer-events:none;letter-spacing:-.02em;max-width:88vw;text-align:center}
.toast.on{opacity:1}

.lightbox{position:fixed;inset:0;z-index:120;background:var(--lb);display:none;
  align-items:center;justify-content:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.lightbox.on{display:flex}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.lbclose{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:16px;
  background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:999px;
  width:38px;height:38px;font-size:17px;cursor:pointer;backdrop-filter:blur(6px)}
.lbsave{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 22px);left:50%;transform:translateX(-50%);
  background:rgba(255,255,255,.92);color:#14161a;border:0;border-radius:999px;
  padding:12px 24px;font-size:14px;font-weight:800;letter-spacing:-.03em;cursor:pointer;
  backdrop-filter:blur(6px);box-shadow:0 4px 16px rgba(0,0,0,.35)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="brand" id="brand">
      <h1>3반 알리미</h1>
      <span class="today" id="today"></span>
    </div>
    <div class="hact">
      <button class="iconbtn" id="themeBtn" aria-label="화면 모드 전환">☾</button>
      <button class="hbtn ghost" id="gearBtn" hidden>분류</button>
      <button class="hbtn" id="installBtn" hidden>설치</button>
    </div>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
</header>

<main><div id="list"><div class="empty">불러오는 중…</div></div></main>

<button class="fab" id="fab" aria-label="새 안내 작성">+</button>

<section class="sheet" id="detail">
  <div class="sheettop">
    <button class="xbtn" onclick="closeSheet('detail')">← 목록</button>
    <button class="delbtn" id="delBtn" style="display:none" onclick="removeItem()">삭제</button>
  </div>
  <div id="detailBody"></div>
</section>

<section class="sheet" id="write">
  <div class="sheettop">
    <button class="xbtn" onclick="closeSheet('write')">← 취소</button>
    <strong style="font-size:14px;font-weight:800;letter-spacing:-.03em">새 안내</strong>
  </div>
  <label class="f">분류</label>
  <div class="catpick" id="catpick"></div>
  <label class="f" for="wTitle">제목</label>
  <input type="text" id="wTitle" placeholder="예) 국어 발표 수행평가">
  <label class="f" for="wDate">날짜 (마감일·행사일)</label>
  <input type="date" id="wDate">
  <p class="hint">비워두면 날짜 없는 안내로 올라가요.</p>
  <label class="f" for="wBody">내용</label>
  <textarea id="wBody" placeholder="준비물, 제출 방법, 유의사항 등"></textarea>
  <label class="f">사진 (최대 4장)</label>
  <button class="filebtn" id="pickBtn">사진 고르기</button>
  <input type="file" id="wFile" accept="image/*" multiple hidden>
  <div class="picked" id="picked"></div>
  <p class="hint">공지 원본 사진을 그대로 올려도 돼요. 자동으로 용량을 줄여서 저장합니다.</p>
  <button class="primary" id="saveBtn">올리기</button>
</section>

<section class="sheet" id="settings">
  <div class="sheettop">
    <button class="xbtn" onclick="closeSheet('settings')">← 닫기</button>
    <strong style="font-size:14px;font-weight:800;letter-spacing:-.03em">분류 관리</strong>
  </div>
  <p class="hint" style="margin:0 0 10px">이름을 고치거나 분류를 추가할 수 있어요. 색은 순서대로 자동 배정됩니다. 저장하면 모든 사용자 화면에 바로 반영돼요.</p>
  <div id="catEdit"></div>
  <button class="filebtn" id="catAdd" style="margin-top:14px">＋ 분류 추가</button>
  <button class="primary" id="catSave">저장</button>
</section>

<section class="sheet" id="admin">
  <div class="sheettop">
    <button class="xbtn" onclick="closeSheet('admin')">← 닫기</button>
    <strong style="font-size:14px;font-weight:800;letter-spacing:-.03em">관리자</strong>
  </div>
  <label class="f" for="aEmail">이메일</label>
  <input type="text" id="aEmail" autocomplete="username">
  <label class="f" for="aPw">비밀번호</label>
  <input type="password" id="aPw" autocomplete="current-password">
  <button class="primary" id="loginBtn">로그인</button>
</section>

<section class="sheet" id="howto">
  <div class="sheettop">
    <button class="xbtn" onclick="closeSheet('howto')">← 닫기</button>
    <strong style="font-size:14px;font-weight:800;letter-spacing:-.03em">홈 화면에 추가</strong>
  </div>
  <div id="howtoBody" class="dtl-body" style="margin-top:0"></div>
</section>

<div class="lightbox" id="lightbox">
  <img id="lbImg" alt="안내 사진">
  <button class="lbclose" id="lbClose" aria-label="닫기">✕</button>
  <button class="lbsave" id="lbSave">사진 저장</button>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, collection, doc, addDoc, deleteDoc, setDoc, onSnapshot, query, orderBy, serverTimestamp }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

/* ── Firebase 연결 정보 (class3 프로젝트) ── */
const firebaseConfig = {
  apiKey: "AIzaSyAtEAosGkDJwkLrI5Vurcw5UgTWpIzyAl0",
  authDomain: "class3-6cf01.firebaseapp.com",
  projectId: "class3-6cf01",
  storageBucket: "class3-6cf01.firebasestorage.app",
  messagingSenderId: "536241412318",
  appId: "1:536241412318:web:de6f6080a6a525f3124a4f"
};

const app  = initializeApp(firebaseConfig);
const db   = getFirestore(app);
const auth = getAuth(app);
const COL  = collection(db, 'notices');
const CFG  = doc(db, 'config', 'categories');

/* ═══ 화면 모드 ═══ */
const themeMeta = document.getElementById('themeMeta');
const themeBtn  = document.getElementById('themeBtn');
let theme = localStorage.getItem('theme') ||
  (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

function applyTheme(t){
  theme = t;
  document.documentElement.dataset.theme = t;
  themeBtn.textContent = t === 'dark' ? '☀' : '☾';
  themeMeta.setAttribute('content', t === 'dark' ? '#101216' : '#ffffff');
  localStorage.setItem('theme', t);
}
applyTheme(theme);
themeBtn.onclick = () => applyTheme(theme === 'dark' ? 'light' : 'dark');

/* ═══ 분류 (id 고정, 이름·개수는 변경 가능) ═══ */
const DEFAULT_CATS = [
  { id:'수행평가', name:'수행평가' },
  { id:'행사',     name:'행사' },
  { id:'생기부',   name:'생기부' }
];
const PALETTE = ['#ffe95c','#c9b8ff','#a3efc9','#ffbf9b','#9fd7ff','#ffb3d1','#d7e37a','#ffd6a5'];
const GRAY = '#c4c9d1';
const MAX_CATS = 8;

let cats = DEFAULT_CATS.map(c => ({...c}));
let draft = [];
const catFound  = id => cats.findIndex(c => c.id === id);
const catName   = id => { const i = catFound(id); return i < 0 ? '기타' : cats[i].name; };
const catColor  = id => { const i = catFound(id); return i < 0 ? GRAY : PALETTE[i % PALETTE.length]; };

let items = [], cat = 'all', isAdmin = false, current = null, pics = [], wCat = cats[0].id;

/* ═══ 날짜 ═══ */
const midnight = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const TODAY = midnight(new Date());
const dday = s => s ? Math.round((midnight(new Date(s+'T00:00:00')) - TODAY)/86400000) : null;
function ddayText(n){
  if(n === null) return { num:'상시', label:'', cls:'none' };
  if(n === 0) return { num:'오늘', label:'', cls:'urgent' };
  if(n === 1) return { num:'내일', label:'', cls:'urgent' };
  if(n > 0)   return { num:'D-'+n, label:'', cls:n<=3?'urgent':'' };
  return { num:'D+'+Math.abs(n), label:'지남', cls:'' };
}
const korDate = s => {
  if(!s) return '날짜 없음';
  const d = new Date(s+'T00:00:00');
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${['일','월','화','수','목','금','토'][d.getDay()]})`;
};
const esc = (s='') => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

/* ═══ 탭 ═══ */
function renderTabs(){
  if(cat !== 'all' && catFound(cat) < 0) cat = 'all';
  const box = document.getElementById('tabs');
  box.innerHTML =
    `<button class="tab" role="tab" data-cat="all" aria-selected="${cat==='all'}">전체<span class="n" data-n="all"></span></button>` +
    cats.map(c => `<button class="tab" role="tab" data-cat="${esc(c.id)}" aria-selected="${cat===c.id}">${esc(c.name)}<span class="n" data-n="${esc(c.id)}"></span></button>`).join('');
  box.querySelectorAll('.tab').forEach(t => t.onclick = () => {
    cat = t.dataset.cat;
    box.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x===t ? 'true':'false'));
    render();
  });
}

/* ═══ 목록 ═══ */
function render(){
  const box = document.getElementById('list');
  const pool = items.filter(i => cat === 'all' || i.cat === cat);

  document.querySelectorAll('[data-n]').forEach(el => {
    const c = el.dataset.n;
    el.textContent = items.filter(i => (c==='all'||i.cat===c) && (!i.date || dday(i.date) >= 0)).length || '';
  });

  const live = pool.filter(i => !i.date || dday(i.date) >= 0).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));
  const past = pool.filter(i => i.date && dday(i.date) < 0).sort((a,b)=>b.date.localeCompare(a.date));

  if(!live.length && !past.length){
    box.innerHTML = '<div class="empty"><b>아직 올라온 안내가 없어요</b>새 안내가 등록되면 여기에 표시됩니다</div>';
    return;
  }
  box.innerHTML = live.map(i => rowHTML(i,false)).join('') +
    (past.length ? '<div class="sechead">지난 안내</div>' + past.map(i => rowHTML(i,true)).join('') : '');
  box.querySelectorAll('.row').forEach(r => r.onclick = () => openDetail(r.dataset.id));
}

function rowHTML(i,isPast){
  const d = ddayText(dday(i.date));
  const thumbs = (i.images||[]).slice(0,3).map(s=>`<img src="${s}" alt="">`).join('');
  return `<article class="row ${isPast?'past':''}" data-id="${i.id}">
    <div class="dcell"><span class="dnum ${d.cls}">${d.num}</span>${d.label?`<span class="dlabel">${d.label}</span>`:''}</div>
    <div>
      <h2 class="rtitle"><mark style="--mk:${catColor(i.cat)}">${esc(i.title)}</mark></h2>
      <div class="rmeta"><span class="cat">${esc(catName(i.cat))}</span><span>·</span><span>${korDate(i.date)}</span></div>
      ${i.body?`<p class="rprev">${esc(i.body)}</p>`:''}
      ${thumbs?`<div class="thumbs">${thumbs}</div>`:''}
    </div>
  </article>`;
}

/* ═══ 상세 ═══ */
window.openDetail = id => {
  const i = items.find(x => x.id === id); if(!i) return;
  current = i;
  const imgs = (i.images||[]).map((s,n)=>`<img src="${s}" alt="안내 사진 ${n+1}">`).join('');
  document.getElementById('detailBody').innerHTML = `
    <div class="dtl-cat"><mark style="--mk:${catColor(i.cat)};background:linear-gradient(transparent var(--markpos), ${catColor(i.cat)} var(--markpos));color:inherit">${esc(catName(i.cat))}</mark></div>
    <h2 class="dtl-title">${esc(i.title)}</h2>
    <div class="dtl-date">${korDate(i.date)}${i.date?' · '+ddayText(dday(i.date)).num:''}</div>
    ${i.body?`<p class="dtl-body">${esc(i.body)}</p>`:''}
    ${imgs?`<div class="dtl-imgs">${imgs}<p class="imgcap">사진을 누르면 크게 볼 수 있어요</p></div>`:''}
    <div class="dtl-foot"><span>3반 알리미</span><span>${i.createdAt?new Date(i.createdAt).toLocaleDateString('ko-KR')+' 등록':''}</span></div>`;
  document.querySelectorAll('#detailBody .dtl-imgs img').forEach(img => img.onclick = () => openLightbox(img.src));
  document.getElementById('delBtn').style.display = isAdmin ? 'block' : 'none';
  openSheet('detail');
};

window.removeItem = async () => {
  if(!current || !confirm('이 안내를 삭제할까요?')) return;
  try{ await deleteDoc(doc(db,'notices',current.id)); closeSheet('detail'); toast('삭제했어요'); }
  catch{ toast('삭제에 실패했어요'); }
};

/* ═══ 사진 뷰어 ═══ */
const lb = document.getElementById('lightbox');
function openLightbox(src){
  document.getElementById('lbImg').src = src;
  lb.classList.add('on'); document.body.style.overflow = 'hidden';
}
function closeLightbox(){
  lb.classList.remove('on'); document.getElementById('lbImg').src = '';
  if(!document.querySelector('.sheet.on')) document.body.style.overflow = '';
}
lb.onclick = closeLightbox;
document.getElementById('lbClose').onclick = e => { e.stopPropagation(); closeLightbox(); };
document.getElementById('lbImg').onclick = e => e.stopPropagation();

document.getElementById('lbSave').onclick = async e => {
  e.stopPropagation();
  const src = document.getElementById('lbImg').src;
  if(!src) return;
  const name = `3반알리미_${String(current?.title||'사진').replace(/[\\/:*?"<>|\s]+/g,'_').slice(0,20)}.jpg`;
  try{
    const blob = await (await fetch(src)).blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 3000);
    toast(isIOS ? '안 되면 사진을 길게 눌러 저장하세요' : '사진을 저장했어요');
  }catch{ toast('사진을 길게 눌러 저장해 주세요'); }
};

window.openSheet  = id => { document.getElementById(id).classList.add('on'); document.body.style.overflow='hidden'; };
window.closeSheet = id => { document.getElementById(id).classList.remove('on'); if(!lb.classList.contains('on')) document.body.style.overflow=''; };

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'), 2400);
}

/* ═══ 구독 ═══ */
onSnapshot(CFG, snap => {
  const list = snap.exists() ? snap.data().list : null;
  if(Array.isArray(list) && list.length)
    cats = list.filter(c => c && c.id).map(c => ({ id:String(c.id), name:c.name || String(c.id) }));
  if(catFound(wCat) < 0) wCat = cats[0].id;
  renderTabs(); render(); drawCatPick();
}, () => {});

onSnapshot(query(COL, orderBy('createdAt','desc')), snap => {
  items = snap.docs.map(d => {
    const v = d.data();
    return { id:d.id, cat:v.cat||'', title:v.title||'', date:v.date||'',
             body:v.body||'', images:v.images||[], createdAt:v.createdAt?.toMillis?.()||null };
  });
  render();
}, () => {
  document.getElementById('list').innerHTML =
    '<div class="empty"><b>연결에 실패했어요</b>Firebase 설정을 확인해 주세요</div>';
});

/* ═══ 관리자 ═══ */
let taps = 0, tapTimer;
document.getElementById('brand').onclick = () => {
  taps++; clearTimeout(tapTimer);
  tapTimer = setTimeout(()=>taps=0, 1200);
  if(taps >= 5){
    taps = 0;
    if(isAdmin){ if(confirm('로그아웃할까요?')) signOut(auth); }
    else openSheet('admin');
  }
};

onAuthStateChanged(auth, user => {
  isAdmin = !!user;
  document.getElementById('fab').classList.toggle('on', isAdmin);
  document.getElementById('gearBtn').hidden = !isAdmin;
  if(user) closeSheet('admin');
});

document.getElementById('loginBtn').onclick = async () => {
  try{
    await signInWithEmailAndPassword(auth,
      document.getElementById('aEmail').value.trim(),
      document.getElementById('aPw').value);
    document.getElementById('aPw').value = '';
    toast('관리자 모드');
  }catch{ toast('이메일이나 비밀번호를 확인해 주세요'); }
};

/* ═══ 분류 관리 ═══ */
document.getElementById('gearBtn').onclick = () => {
  draft = cats.map(c => ({...c}));
  drawCatEdit(); openSheet('settings');
};

function drawCatEdit(){
  document.getElementById('catEdit').innerHTML = draft.map((c,n) => `
    <div class="crow">
      <span class="sw" style="background:${PALETTE[n % PALETTE.length]}"></span>
      <input type="text" data-i="${n}" value="${esc(c.name)}" maxlength="10" placeholder="분류 이름">
      <button class="del" data-del="${n}" aria-label="삭제">✕</button>
    </div>`).join('');

  document.querySelectorAll('#catEdit input').forEach(inp =>
    inp.oninput = () => { draft[inp.dataset.i].name = inp.value; });

  document.querySelectorAll('#catEdit .del').forEach(b => b.onclick = () => {
    const n = +b.dataset.del;
    if(draft.length <= 1){ toast('분류는 최소 하나 필요해요'); return; }
    const used = items.filter(i => i.cat === draft[n].id).length;
    const msg = used
      ? `"${draft[n].name}" 분류에 안내 ${used}개가 있어요.\n삭제해도 안내는 남지만 "기타"로 표시됩니다. 계속할까요?`
      : `"${draft[n].name}" 분류를 삭제할까요?`;
    if(!confirm(msg)) return;
    draft.splice(n,1); drawCatEdit();
  });
}

document.getElementById('catAdd').onclick = () => {
  if(draft.length >= MAX_CATS){ toast(`분류는 최대 ${MAX_CATS}개까지예요`); return; }
  draft.push({ id:'c'+Date.now().toString(36), name:'' });
  drawCatEdit();
  const inputs = document.querySelectorAll('#catEdit input');
  inputs[inputs.length-1].focus();
};

document.getElementById('catSave').onclick = async () => {
  const next = draft.map(c => ({ id:c.id, name:(c.name||'').trim() }));
  if(next.some(c => !c.name)){ toast('빈 이름이 있어요'); return; }
  const btn = document.getElementById('catSave');
  btn.disabled = true; btn.textContent = '저장 중…';
  try{
    await setDoc(CFG, { list: next });
    closeSheet('settings'); toast('분류를 저장했어요');
  }catch{ toast('저장 실패 — 보안 규칙에 config 항목이 있는지 확인하세요'); }
  btn.disabled = false; btn.textContent = '저장';
};

/* ═══ 작성 ═══ */
function drawCatPick(){
  document.getElementById('catpick').innerHTML = cats.map(c =>
    `<button data-c="${esc(c.id)}" aria-pressed="${wCat===c.id}">${esc(c.name)}</button>`).join('');
  document.querySelectorAll('#catpick button').forEach(b => b.onclick = () => {
    wCat = b.dataset.c;
    document.querySelectorAll('#catpick button').forEach(x =>
      x.setAttribute('aria-pressed', x===b ? 'true':'false'));
  });
}

document.getElementById('fab').onclick = () => {
  wCat = cats[0].id; drawCatPick();
  ['wTitle','wDate','wBody'].forEach(id => document.getElementById(id).value = '');
  pics = []; drawPicked(); openSheet('write');
};

document.getElementById('pickBtn').onclick = () => document.getElementById('wFile').click();
document.getElementById('wFile').onchange = async e => {
  for(const f of [...e.target.files].slice(0, 4 - pics.length)){
    try{ pics.push(await compress(f)); }catch{ toast('사진 하나를 못 읽었어요'); }
  }
  drawPicked(); e.target.value = '';
};

function drawPicked(){
  document.getElementById('picked').innerHTML = pics.map((s,n)=>
    `<div class="p"><img src="${s}" alt=""><button class="rm" onclick="dropPic(${n})">✕</button></div>`).join('');
}
window.dropPic = n => { pics.splice(n,1); drawPicked(); };

function compress(file){
  return new Promise((res,rej)=>{
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1400/Math.max(img.width,img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      let q = .75, out = c.toDataURL('image/jpeg', q);
      while(out.length > 300000 && q > .35){ q -= .1; out = c.toDataURL('image/jpeg', q); }
      URL.revokeObjectURL(img.src); res(out);
    };
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}

document.getElementById('saveBtn').onclick = async () => {
  const title = document.getElementById('wTitle').value.trim();
  if(!title){ toast('제목을 입력해 주세요'); return; }
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = '올리는 중…';
  try{
    await addDoc(COL, {
      cat: wCat, title,
      date: document.getElementById('wDate').value,
      body: document.getElementById('wBody').value.trim(),
      images: pics, createdAt: serverTimestamp()
    });
    closeSheet('write'); toast('올렸어요');
  }catch{ toast('저장에 실패했어요. 사진 수를 줄여보세요'); }
  btn.disabled = false; btn.textContent = '올리기';
};

/* ═══ 설치 ═══ */
document.getElementById('today').textContent =
  `${TODAY.getMonth()+1}월 ${TODAY.getDate()}일 ${['일','월','화','수','목','금','토'][TODAY.getDay()]}요일`;

const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const iBtn = document.getElementById('installBtn');
let deferred = null;

if(!standalone) iBtn.hidden = false;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; });
addEventListener('appinstalled', () => { iBtn.hidden = true; toast('설치했어요'); });

iBtn.onclick = async () => {
  if(deferred){
    deferred.prompt();
    const { outcome } = await deferred.userChoice;
    deferred = null;
    if(outcome === 'accepted') iBtn.hidden = true;
    return;
  }
  document.getElementById('howtoBody').innerHTML = isIOS
    ? '사파리에서 아래쪽 <b>공유 버튼</b>을 누르고\n<b>홈 화면에 추가</b>를 선택하세요.\n\n크롬 앱에서 열었다면 사파리로 다시 열어야 설치할 수 있어요.'
    : '브라우저 메뉴(⋮)에서\n<b>앱 설치</b> 또는 <b>홈 화면에 추가</b>를 누르세요.\n\n이미 설치했다면 홈 화면의 아이콘으로 열면 됩니다.';
  openSheet('howto');
};

if('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));

addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if(lb.classList.contains('on')) closeLightbox();
  else document.querySelectorAll('.sheet.on').forEach(s => closeSheet(s.id));
});

renderTabs(); drawCatPick();
</script>
</body>
</html>
